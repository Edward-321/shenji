<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>澄页 · 脚本管理</title><link rel="stylesheet" href="style.css"></head><body><main><header><span class="logo">澄</span><div><h1>澄页 <small>Script Studio</small></h1><p>让网页回归清爽，把控制权留给你。</p></div></header><section class="notice">实验版 · 导入的脚本默认关闭。脚本能读取其匹配网页的内容，请只启用可信来源。尚未签名安装，非完整 Tampermonkey 替代品。</section><section class="toolbar"><button id="builtin">导入三组内置脚本</button><label class="button">批量导入 .user.js / JSON<input id="files" type="file" accept=".js,.json" multiple hidden></label><label class="button secondary">导入文件夹<input id="folder" type="file" webkitdirectory multiple hidden></label><button id="export" class="secondary">导出全部</button><button id="pause" class="secondary">暂停全部</button></section><section class="stats"><strong id="count">0 个脚本</strong><input id="search" placeholder="搜索名称、描述或站点…" aria-label="搜索脚本"><select id="filter" aria-label="筛选"><option value="all">全部</option><option value="enabled">已启用</option><option value="disabled">已关闭</option><option value="problem">不兼容</option></select></section><p id="status" role="status"></p><section id="list"></section><nav><button id="prev" class="secondary">上一页</button><span id="page"></span><button id="next" class="secondary">下一页</button></nav><details><summary>粘贴或编辑用户脚本</summary><input id="editId" type="hidden"><textarea id="source" spellcheck="false" placeholder="// ==UserScript=="></textarea><button id="save">保存（默认关闭）</button><button id="clear" class="secondary">清空编辑器</button></details><footer>本地存储 · 无账户 · 无遥测 · 批量导入分批写入，列表分页显示。启停后刷新网页生效。</footer></main><script src="lib/core.js"></script><script src="manager.js"></script></body></html>
