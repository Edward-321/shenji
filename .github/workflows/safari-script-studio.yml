name: Safari Script Studio iOS
on:
  push:
    branches: ['safari-script-studio', 'safari-script-studio-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safari:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Convert, archive and package iOS extension
        working-directory: safari-script-studio
        run: bash cloud-build.sh
      - name: Upload source, IPA and validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safari-script-studio-ios-${{ github.run_number }}
          path: safari-script-studio/dist/
          if-no-files-found: warn
          retention-days: 30
