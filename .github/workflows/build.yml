name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # macos-14 = Apple Silicon runner，自带完整 Xcode 15.4 + iOS SDK
    # 不需要手写 .tbd 桩，clang 驱动直接链接系统库
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos clang --version

      - name: Install ldid + dpkg
        run: brew install ldid dpkg

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Package deb
        run: |
          chmod +x package-deb.sh
          ./package-deb.sh

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            build/
            dist/*.deb

      - name: Summary
        if: always()
        run: |
          {
            echo "### 构建产物"
            echo ""
            echo '```'
            ls -la build/ 2>/dev/null || echo "(无)"
            echo '```'
            echo ""
            echo '```'
            ls -la dist/ 2>/dev/null || echo "(无 deb)"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY